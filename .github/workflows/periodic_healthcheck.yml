name: Periodic Health-check Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/23 * * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: URL Health Check
        uses: Jtalk/url-health-check-action@v5
        with:
          url: ${{ secrets.RENDER_DEPLOY_HOOK }}
          max-attempts: 3
          retry-delay: 5s

      #v - run: echo "hello"
